name: Build Custom PHP Micro.sfx

on:
  workflow_dispatch: # 允许手动点击运行

jobs:
  build:
    runs-on: windows-latest # 使用 Windows 虚拟机来编译 Windows 版本的 sfx
    
    steps:
      - name: Checkout static-php-cli
        uses: actions/checkout@v4
        with:
          repository: 'i900xz/static-php-cli'
          ref: 'main'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, curl
          tools: composer

      # 安装 static-php-cli 自身的 Composer 依赖，生成 autoload.php
      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader

      # 在 Windows 环境下，spc doctor 会自动配置好 Visual Studio 编译环境
      - name: Run SPC Doctor (Install Windows Build Toolchain)
        run: .\bin\spc doctor --auto-fix

      # 使用 -e 参数精确下载 Windows 编译所需的资源
      - name: Fetch Sources
        run: |
          .\bin\spc download --with-php=8.4 -e "bcmath,calendar,curl,dom,filter,hash,iconv,json,libxml,mysqlnd,pcre,pdo,phar,random,session,simplexml,spl,standard,tokenizer,xml,xmlreader,xmlwriter,zlib" --prefer-pre-built -R 5

      # 编译 Windows 版本的 micro.sfx
      # ✨ 增加了 --without-micro-ext-test 参数，跳过不稳定的 curl 自检，直接产出成果！
      - name: Build micro.sfx
        run: |
          .\bin\spc build "bcmath,calendar,curl,dom,filter,hash,iconv,json,libxml,mysqlnd,pcre,pdo,phar,random,session,simplexml,spl,standard,tokenizer,xml,xmlreader,xmlwriter,zlib" --build-micro --without-micro-ext-test

      - name: Upload micro.sfx Artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-micro-sfx-windows
          path: buildroot/bin/micro.sfx
