name: Build Custom PHP Micro.sfx

on:
  workflow_dispatch: # 允许手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout static-php-cli
        uses: actions/checkout@v4
        with:
          repository: 'i900xz/static-php-cli'
          ref: 'main'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, curl

      - name: Install Composer Dependencies
        run: composer install --no-dev --classmap-authoritative

      - name: Fetch Sources
        run: |
          ./bin/spc download --with-php=8.3 \
          bcmath,calendar,curl,dom,filter,hash,iconv,json,libxml,mysqlnd,pcre,pdo,phar,random,readline,session,simplexml,spl,standard,tokenizer,xml,xmlreader,xmlwriter,zlib

      - name: Build micro.sfx
        run: |
          ./bin/spc build \
          bcmath,calendar,curl,dom,filter,hash,iconv,json,libxml,mysqlnd,pcre,pdo,phar,random,readline,session,simplexml,spl,standard,tokenizer,xml,xmlreader,xmlwriter,zlib \
          --build-micro

      # 修正了这里：由 actions/artifacts 变更为 actions/upload-artifact
      - name: Upload micro.sfx Artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-micro-sfx
          path: buildroot/bin/micro.sfx
